name: CI

on:
  push:
    branches: [develop, main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

# Annule le run précédent si un nouveau commit arrive sur la même branche
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, tests et build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Même version majeure que le Dockerfile
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      # Échoue sur une vulnérabilité haute ou critique, y compris en développement.
      # Ne couvre pas xlsx, installé depuis le CDN de SheetJS.
      - run: npm audit --audit-level=high

      - run: npm run lint

      - run: npm test

      - run: npm run build

  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      # Construction seule : la publication est faite par le job "publish"
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: secret-santa:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Démarrer le conteneur
        run: >-
          docker run -d --name secret-santa -p 3000:3000
          --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges
          secret-santa:ci

      - name: Vérifier que l'application répond avec ses en-têtes de sécurité
        run: |
          curl --fail --silent --show-error \
            --retry 15 --retry-delay 1 --retry-all-errors \
            --dump-header headers.txt --output index.html http://localhost:3000/
          grep -q '<div id="root">' index.html
          grep -qi '^content-security-policy:' headers.txt

      - name: Vérifier que le conteneur ne tourne pas en root
        run: test "$(docker exec secret-santa id -u)" != "0"

      - name: Afficher les logs du conteneur
        if: failure()
        run: docker logs secret-santa

  publish:
    name: Publication sur GHCR
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # main : latest et sha-xxxxxxx / tag v1.2.3 : 1.2.3, 1.2 et sha-xxxxxxx
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      # Sans cache, pour que l'image publiée embarque les derniers correctifs Alpine
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
